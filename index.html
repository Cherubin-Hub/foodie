<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=64&q=80" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foodie. — Hot meals, right at your door</title>
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('foodie_app_storage');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
              return;
            }
          }
          document.documentElement.classList.remove('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 antialiased selection:bg-brand-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
